name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job here needs write access
permissions:
  contents: read

jobs:
  # Fast checks: run on every PR and push
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      # Advisory only until the 80 existing findings are triaged:
      # continue-on-error shows yellow without blocking merges. Flip to
      # blocking once ruff is clean (delete the continue-on-error line).
      - name: Lint (ruff, advisory)
        run: uvx ruff check .
        continue-on-error: true

      - name: Smoke test (imports + agent loads)
        run: |
          uv run python3 -c "import agent"
          uv run python3 agent/main.py --help

      # Blocking, no `|| echo`: a red test job must mean failing tests.
      - name: Run unit tests
        run: uv run pytest -q

  # Determinism guarantees: enforce the README's invariants at PR time
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      # Regenerate into a FRESH directory. Uses synth_dataset.py — the
      # SYNTHETIC generator (stdlib-only, deterministic, profile-driven
      # filenames matching data/synth/). NOT gen_dataset.py, which drives
      # inject.sh against a live lab host and requires root.
      #
      # synth_dataset.py refuses to write into a non-empty directory, so
      # CI regeneration can never duplicate snapshots or poison the
      # committed corpus.
      #
      # Counts match the canonical generation: 150 clean + 12 singles x 15
      # misconfigs + 250 combos = 580 snapshots, seed 7.
      #
      # NOTE: an emitted timestamps (`collected_at`, epoch-ms filename suffix)
      # vary per run — determinism applies to the FEATURE content, not the
      # raw bytes. The assertions below therefore rely on feature_keys.json
      # equality, not file-level diffing.
      - name: Regenerate synthetic dataset (seed 7) into clean directory
        run: >
          uv run python3 experiments/synth_dataset.py
          --out data/synth_ci
          --clean 150 --singles 12 --combos 250
          --seed 7

      # README invariant: regenerated set MUST be exactly 580 snapshots
      - name: Assert snapshot count is 580
        run: |
          count=$(find data/synth_ci -maxdepth 1 -name '*.json' | wc -l)
          echo "Generated snapshots: $count"
          if [ "$count" -ne 580 ]; then
            echo "::error::Expected 580 snapshots, got $count — duplication or missing data invalidates out-of-fold CV"
            exit 1
          fi

      # Class-balance sanity: matches synth_dataset.py's own printed summary
      # (150 clean / 430 vulnerable from singles+combos)
      - name: Assert class balance
        run: |
          labels=$(grep -l '"label": "clean"' data/synth_ci/*.json | wc -l)
          echo "Clean snapshots: $labels"
          if [ "$labels" -ne 150 ]; then
            echo "::error::Expected 150 clean snapshots, got $labels"
            exit 1
          fi

      - name: Train model on regenerated data
        run: uv run python3 train/train.py --dataset data/synth_ci --out models_ci

      # Schema drift guard: retraining on the deterministic dataset must export
      # a feature catalog byte-identical to the committed one. If this fails,
      # someone changed the feature vector and every existing model.joblib /
      # dataset pairing is invalidated.
      - name: Assert feature_keys.json is unchanged
        run: |
          diff -u models/feature_keys.json models_ci/feature_keys.json \
            || { echo "::error::feature_keys.json drifted from the committed schema"; exit 1; }

      # Round-trip check: a freshly trained model runs the full L0-L3 loop
      # against a committed fixture via --model (agent loads models/ by
      # default per test_artifacts_synced.py, so we pass it explicitly).
      # DB and report go to /tmp so nothing in the repo is dirtied.
      - name: Fresh model runs end-to-end in agent
        run: |
          uv run python3 agent/main.py \
            --snapshot tests/fixtures/scan_m11.json \
            --db /tmp/ci_mem.db \
            --report /tmp/ci_report.md \
            --model models_ci/model.joblib

      # Upload regenerated artifacts for debugging when something drifts
      - name: Upload regenerated artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regeneration-debug
          path: |
            models_ci/
          retention-days: 5
