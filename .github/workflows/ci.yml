name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Smoke test (imports + agent loads)
        run: |
          uv run python3 -c "import agent"
          uv run python3 agent/main.py --help

      - name: Run unit tests
        run: uv run pytest -q || echo "no tests / tests failing (non-blocking)"
